<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container dashboard-container">
        <header class="header">
            <h2 id="welcome-msg">Tasks</h2>
            <div class="header-buttons">
                <a href="admin.html" id="admin-btn" class="btn-admin" style="display: none;">Admin Panel 🛡️</a>
                
                <button id="btn-logout" class="btn-logout">Çıkış Yap</button>
            </div>
        </header>

        <section class="task-form-section">
            <form id="task-form">
                <input type="text" id="task-title" placeholder="Yeni görev başlığı..." required>
                <input type="text" id="task-desc" placeholder="Açıklama (Opsiyonel)">
                <button type="submit" class="btn-add">Ekle</button>
            </form>
        </section>

        <section class="task-list-section">
            <div id="task-list">
                <p>Yükleniyor...</p>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
