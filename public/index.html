<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container auth-container">
        <div class="auth-box">
            <h1>Task Manager 🚀</h1>

            <div id="login-section">
                <h2>Login</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="login-email" placeholder="example@mail.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="login-password" placeholder="******" required>
                    </div>
                    <button type="submit" class="btn-primary">Login</button>
                </form>
                <p class="toggle-text">
                    Don't you have an account?
                    <a href="#" id="btn-show-register">Sign Up</a>
                </p>
            </div>

            <div id="register-section" class="hidden">
                <h2>Sign Up</h2>
                <form id="register-form">
                    <div class="form-group">
                        <label>User name</label>
                        <input type="text" id="reg-username" placeholder="Your name" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="reg-email" placeholder="example@mail.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="reg-password" placeholder="******" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Admin Key (Opsiyonel)</label>
                        <input type="password" id="reg-admin-key" placeholder="For Admins Only...">
                    </div>

                    <button type="submit" class="btn-secondary">Sign Up</button>
                </form>
                <p class="toggle-text">
                    Already a member? 
                    <a href="#" id="btn-show-login">Login</a>
                </p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
