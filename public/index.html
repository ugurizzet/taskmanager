<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container auth-container">
        <div class="auth-box">
            <h1>Task Manager 🚀</h1>

            <div id="login-section">
                <h2>Login</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="login-email" placeholder="ornek@mail.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="login-password" placeholder="******" required>
                    </div>
                    <button type="submit" class="btn-primary">Login</button>
                </form>
                <p class="toggle-text">
                    Hesabın yok mu? 
                    <a href="#" id="btn-show-register">Kayıt Ol</a>
                </p>
            </div>

            <div id="register-section" class="hidden">
                <h2>Kayıt Ol</h2>
                <form id="register-form">
                    <div class="form-group">
                        <label>Kullanıcı Adı</label>
                        <input type="text" id="reg-username" placeholder="Adınız" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="reg-email" placeholder="ornek@mail.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="reg-password" placeholder="******" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Admin Key (Opsiyonel)</label>
                        <input type="password" id="reg-admin-key" placeholder="Sadece Adminler için...">
                    </div>

                    <button type="submit" class="btn-secondary">Kayıt Ol</button>
                </form>
                <p class="toggle-text">
                    Zaten üye misin? 
                    <a href="#" id="btn-show-login">Login</a>
                </p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
